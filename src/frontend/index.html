<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, minimum-scale=1.0">
    <meta name="theme-color" content="#0c0a09">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>abgehakt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.png">
    <link rel="icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <svg class="icon-sprite" aria-hidden="true">
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
        <symbol id="i-bell-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3A6 6 0 0 1 18 8c0 2.4.4 4.2.9 5.5"/><path d="M17 17H3s3-2 3-9a6 6 0 0 1 .3-1.8"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></symbol>
        <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
        <symbol id="i-grip" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="15" cy="18" r="1.6"/></symbol>
        <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
    </svg>

    <header>
        <h1><img src="icon-192-dark.png" alt="" class="logo-icon">abgehakt</h1>
        <div class="header-actions">
            <button id="notifyBtn" class="icon-btn" title="Benachrichtigungen aktivieren"></button>
            <button id="themeToggle" class="icon-btn" title="Dark/Light Mode"></button>
        </div>
    </header>

    <!-- Add new todo -->
    <form id="addForm" class="add-form">
        <div class="input-row">
            <input
                type="text"
                id="titleInput"
                placeholder="Was muss erledigt werden?"
                autocomplete="off"
                required
            >
            <button type="button" id="expandBtn" class="ghost-btn" title="Datum / Notiz hinzufügen">
                <svg aria-hidden="true"><use href="#i-cal"/></svg>
            </button>
            <button type="submit" id="addBtn" class="submit-btn" title="Hinzufügen">
                <svg aria-hidden="true"><use href="#i-plus"/></svg>
            </button>
        </div>
        <div class="add-extras" id="addExtras" style="display:none">
            <input type="text" id="notesInput" placeholder="Notiz (optional)">
            <div class="field-row">
                <input type="date" id="dateInput">
                <input type="time" id="timeInput" placeholder="Uhrzeit">
            </div>
            <div class="field-row">
                <select id="recurringSelect">
                    <option value="">Einmalig</option>
                    <option value="daily">Täglich</option>
                    <option value="weekly">Wöchentlich</option>
                    <option value="monthly">Monatlich</option>
                    <option value="yearly">Jährlich</option>
                </select>
                <input type="text" id="tagsInput" placeholder="Tags, kommagetrennt">
            </div>
            <label class="notify-label">
                <input type="checkbox" id="notifyCheck">
                <svg aria-hidden="true"><use href="#i-bell"/></svg>
                An Fälligkeit erinnern
            </label>
        </div>
    </form>

    <!-- Filter tabs -->
    <nav class="tabs">
        <button class="tab active" data-filter="all">Alle</button>
        <button class="tab" data-filter="today">Heute</button>
        <button class="tab" data-filter="week">Woche</button>
    </nav>

    <!-- Tag filter chips -->
    <div id="tagFilterChips" class="tag-filter-chips" role="list"></div>

    <!-- Todo list -->
    <div id="todoList" class="todo-list" role="list">
        <!-- Items rendered by JS -->
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state" style="display:none">
        <div class="empty-icon"><svg aria-hidden="true"><use href="#i-inbox"/></svg></div>
        <p>Noch nichts zu tun!</p>
        <p class="empty-sub">Füg oben einen Task hinzu.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
